<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="quiz-container">
        <h1>General Knowledge Quiz</h1>
        <p class="intro">Test your knowledge with these four questions!</p>

        <form>
            <div class="question">
                <label for="q1">1. What is the capital city of France?</label>
                <input type="text" id="q1" name="q1" placeholder="Enter your answer">
            </div>

            <div class="question">
                <label for="q2">
                    2. In a few sentences, explain why the ocean is important to Earth.
                </label>
                <textarea id="q2" name="q2" placeholder="Write your answer here..."></textarea>
            </div>

            <div class="question">
                <label for="q3">3. Which planet is known as the Red Planet?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="earth">Earth</option>
                    <option value="mars">Mars</option>
                    <option value="jupiter">Jupiter</option>
                    <option value="venus">Venus</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">4. How many continents are there?</label>
                <input type="number" id="q4" name="q4" min="1" step="1"
                  placeholder="Enter a number">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
